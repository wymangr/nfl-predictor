<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFL Prediction Dashboard</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14181d;
    --border: #262c34;
    --text: #e9ecef;
    --muted: #868e96;
    --accent: #4dabf7;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    height: 100vh;
    display: grid;
    grid-template-columns: 280px 1fr;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
  }
  aside {
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 1rem 0;
  }
  aside h1 {
    font-size: 15px;
    margin: 0 1rem 1rem;
    letter-spacing: .02em;
  }
  aside button {
    display: block;
    width: 100%;
    text-align: left;
    padding: .6rem 1rem;
    background: none;
    border: 0;
    border-left: 3px solid transparent;
    color: var(--text);
    cursor: pointer;
    font: inherit;
  }
  aside button:hover { background: #1b2027; }
  aside button.active {
    border-left-color: var(--accent);
    background: #1b2027;
  }
  aside button small {
    display: block;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.35;
    margin-top: .15rem;
  }
  main { display: flex; flex-direction: column; min-width: 0; }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .75rem;
    padding: .75rem 1rem;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h2 { font-size: 15px; margin: 0; flex: 1; }
  select, header button {
    background: #1b2027;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: .35rem .7rem;
    font: inherit;
    cursor: pointer;
  }
  header button:hover:not(:disabled) { border-color: var(--accent); }
  header button:disabled { opacity: .5; cursor: progress; }
  header .divider {
    width: 1px;
    align-self: stretch;
    background: var(--border);
    margin: 0 .25rem;
  }
  #status { color: var(--muted); font-size: 12px; }
  #status.error { color: #ff8787; }
  iframe { flex: 1; border: 0; width: 100%; background: #fff; }
  #empty {
    flex: 1;
    display: grid;
    place-items: center;
    color: var(--muted);
  }
</style>
</head>
<body>
<aside>
  <h1>NFL Reports</h1>
  {% for report in reports %}
  <button data-key="{{ report.key }}"
          data-label="{{ report.label }}"
          data-seasons="{{ 1 if report.seasons_param else 0 }}">
    {{ report.label }}
    <small>{{ report.description }}</small>
  </button>
  {% endfor %}
</aside>

<main>
  <header>
    <h2 id="title">Select a report</h2>
    <span id="status"></span>
    <select id="season" hidden>
      {% for season in seasons %}
      <option value="{{ season }}">{{ season }}</option>
      {% endfor %}
    </select>
    <select id="week" hidden>
      {% for week in weeks %}
      <option value="{{ week }}">Week {{ week }}</option>
      {% endfor %}
    </select>
    <button id="refresh" disabled>Regenerate</button>
    <span class="divider"></span>
    <button id="refreshSpreads" title="nfl data refresh --spreads">Refresh Spreads</button>
    <button id="refreshWeek" title="Fetch this week's game data, QB information, and spreads; keep saved predictions unchanged">Refresh This Week</button>
    <button id="refreshAll" title="nfl data refresh">Full Refresh</button>
    <button id="trainModel" title="nfl model train">Train Model</button>
  </header>
  <div id="empty">Pick a report from the left.</div>
  <iframe id="frame" title="Report" hidden></iframe>
</main>

<script>
  const frame = document.getElementById('frame');
  const empty = document.getElementById('empty');
  const title = document.getElementById('title');
  const status = document.getElementById('status');
  const seasonSelect = document.getElementById('season');
  const weekSelect = document.getElementById('week');
  const refresh = document.getElementById('refresh');
  let current = null;
  let taskRunning = false;
  let reportLoading = false;

  function url(force) {
    const params = new URLSearchParams();
    if (current.seasons) {
      params.set('season', seasonSelect.value);
      if (weekSelect.value) params.set('week', weekSelect.value);
    }
    if (force) params.set('force', '1');
    params.set('t', Date.now());
    return `/report/${current.key}?${params}`;
  }

  async function loadWeeks() {
    const res = await fetch(`/api/weeks?season=${seasonSelect.value}`);
    const weeks = await res.json();
    weekSelect.innerHTML = weeks.map((w) => `<option value="${w}">Week ${w}</option>`).join('');
  }

  function load(force) {
    if (!current) return;
    reportLoading = true;
    syncControls();
    setStatus(force ? 'Regenerating…' : 'Loading…');
    empty.hidden = true;
    frame.hidden = false;
    frame.src = url(force);
  }

  frame.addEventListener('load', () => {
    if (!current) return;
    reportLoading = false;
    const failure = frame.contentDocument?.querySelector('[data-report-error]');
    setStatus(failure ? failure.textContent : 'Updated ' + new Date().toLocaleTimeString(), Boolean(failure));
    syncControls();
  });

  document.querySelectorAll('aside button').forEach((btn) => {
    btn.addEventListener('click', async () => {
      document.querySelectorAll('aside button').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      current = {
        key: btn.dataset.key,
        seasons: btn.dataset.seasons === '1',
      };
      title.textContent = btn.dataset.label;
      seasonSelect.hidden = !current.seasons;
      weekSelect.hidden = !current.seasons;
      if (current.seasons) await loadWeeks();
      load(false);
    });
  });

  seasonSelect.addEventListener('change', async () => {
    await loadWeeks();
    load(false);
  });
  weekSelect.addEventListener('change', () => load(false));
  refresh.addEventListener('click', () => {
    if (current.key === 'future-predictions' &&
        !confirm('Regenerate recalculates predictions and confidence ranks. To preserve saved picks, use Refresh This Week instead. Continue?')) return;
    load(true);
  });

  const refreshSpreads = document.getElementById('refreshSpreads');
  const refreshWeek = document.getElementById('refreshWeek');
  const refreshAll = document.getElementById('refreshAll');
  const trainModel = document.getElementById('trainModel');

  function syncControls() {
    const busy = taskRunning || reportLoading;
    [refreshSpreads, refreshWeek, refreshAll, trainModel, seasonSelect, weekSelect,
      ...document.querySelectorAll('aside button')].forEach((b) => (b.disabled = busy));
    refresh.disabled = busy || !current;
  }

  function setStatus(text, isError) {
    status.textContent = text;
    status.classList.toggle('error', Boolean(isError));
  }

  async function runTask(task, label) {
    if (taskRunning || reportLoading) return;
    taskRunning = true;
    syncControls();
    const started = Date.now();
    const tick = setInterval(() => {
      setStatus(`${label}… ${Math.round((Date.now() - started) / 1000)}s`);
    }, 1000);
    setStatus(`${label}…`);

    try {
      const res = await fetch(`/api/run/${task}`, {
        method: 'POST',
        headers: { 'X-Requested-With': 'nfl-dashboard' },
      });
      const body = await res.json();
      if (!body.ok) throw new Error(body.error || `HTTP ${res.status}`);
      clearInterval(tick);
      setStatus(`${label} done in ${body.seconds}s`);
      if (current) {
        if (current.seasons) await loadWeeks();
        load(false);
      }
    } catch (err) {
      setStatus(`${label} failed: ${err.message}`, true);
    } finally {
      clearInterval(tick);
      taskRunning = false;
      syncControls();
    }
  }

  refreshSpreads.addEventListener('click', () => runTask('spreads', 'Refreshing spreads'));
  refreshWeek.addEventListener('click', () => runTask('week', 'Refreshing this week'));
  refreshAll.addEventListener('click', () => {
    if (confirm('A full refresh rebuilds every season and takes several minutes. Continue?')) {
      runTask('full', 'Full refresh');
    }
  });
  trainModel.addEventListener('click', () => {
    if (confirm('Training overwrites nfl-prediction.pkl and takes a few minutes. Continue?')) {
      runTask('train', 'Training model');
    }
  });
</script>
</body>
</html>
